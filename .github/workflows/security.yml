name: Security checks
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  security:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/security.yml@f06eb74320f169fa6ce3690b0cd44ccfba8f199b # v1.8.0 candidate
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      languages: '["actions", "python"]'
  report:
    needs: security
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@f06eb74320f169fa6ce3690b0cd44ccfba8f199b # v1.8.0 candidate
    permissions:
      issues: write
    with:
      title: Weekly security checks failed
