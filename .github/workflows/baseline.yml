name: Weekly baseline update
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  baseline:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/baseline-sync.yml@f60efba792d811aa8a848cc465c3ae20523fdf14 # reviewed default-branch maintenance candidate
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
