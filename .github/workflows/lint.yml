name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@2185db43cf5e6c74875ebc8e0b2bb2029f963ab7 # candidate for v1.9.0
    permissions:
      contents: read
    with:
      # PRs gate the files they change; the weekly sweep reports the backlog.
      full-scan: ${{ github.event_name != 'pull_request' }}
