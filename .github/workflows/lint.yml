name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@c0c8b06b49730739386f8b4fadae8962be22f7ae # candidate for v1.9.0
    permissions:
      contents: read
    with:
      # PRs gate the files they change; the weekly sweep reports the backlog.
      full-scan: ${{ github.event_name != 'pull_request' }}
